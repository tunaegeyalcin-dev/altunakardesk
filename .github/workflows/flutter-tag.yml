name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  altunakar-marka:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Altunakar marka denetimi
        run: python3 altunakar/marka_denetimi.py

  run-flutter-tag-build:
    needs: altunakar-marka
    permissions:
      contents: write  # surum yayinlama (catal varsayilani salt okunur)
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
